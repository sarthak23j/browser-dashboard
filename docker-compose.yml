version: '3.8'

services:
  browser-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: browser-dashboard
    restart: unless-stopped
    ports:
      # Allows a cloudflared container to reach the origin through the Docker host.
      - "1337:8000"
    environment:
      - PORT=8000
    networks:
      - cloudflare-tunnel

networks:
  cloudflare-tunnel:
    external: true
