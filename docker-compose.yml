version: '3.8'

services:
  browser-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: browser-dashboard
    restart: unless-stopped
    ports:
      # Keep the origin private; cloudflared on this host can reach localhost.
      - "127.0.0.1:1337:8000"
    environment:
      - PORT=8000
